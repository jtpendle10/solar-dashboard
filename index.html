<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solar Dashboard</title>
    <style>
        body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background-color: #9AAA4D; /* Ndustrial green */
    color: #fff; /* white text for contrast */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
        }
        img.logo {
            width: 300px;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;,
            font-weight: bold;
            text-align: center;
        }
        #response {
            font-size: 2.5rem;
            font-weight: 700;
            background-color: #e0e0e0;
            color:#111;
            padding: 2rem 4rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <img class="logo" src="https://ndustrial.io/wp-content/uploads/2020/08/Group-642.png" alt="Ndustrial Logo">
    <h1>Solar Dashboard</h1>
    <div id="response">Loading...</div>

    <script>
const apiUrl = 'https://solar-backend-210u.onrender.com/proxy'; // update after Render deploy

const headers = { 'Content-Type': 'application/json' };
const now = new Date();
const oneHourAgo = new Date(now.getTime() - 30 * 60 * 1000);

const to = now.toISOString();
const from = oneHourAgo.toISOString();

const data = {
    query: `query($filter: MainServiceFilter, $from: String!, $to: String!, $aggregation: MetricDataAggregationMethod!) {
        mainServices(filter: $filter) {
            nodes {
                type
                meterDemand {
                    data(from: $from, to: $to, aggregation: $aggregation) {
                        nodes {
                            time
                            data
                            label
                            metadata
                        }
                    }
                }
            }
        }
    }`,
    variables: {
        filter: { type: { equalTo: "SOLAR" } },
        from: from,
        to: to,
        aggregation: "LAST"
    }
};


        fetch(apiUrl, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(result => {
            const nodes = result.data.mainServices.nodes[0].meterDemand.data.nodes;
            const total = nodes.reduce((sum, node) => sum + node.data, 0);
            document.getElementById('response').innerText = `Current Metered Solar Output: ${total.toFixed(2)} kW`;
        })
        .catch(err => {
            console.error(err);
            document.getElementById('response').innerText = 'Error loading data';
        });
    </script>
</body>
</html>
